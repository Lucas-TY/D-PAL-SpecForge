model:
  target_model_path: Qwen/Qwen3-4B
  draft_model_config: configs/qwen3-4b-dpal-b16.json
  target_backend: sglang
  embedding_key: model.embed_tokens.weight
  torch_dtype: bfloat16

data:
  hidden_states_path: ./cache/hidden_states/qwen3-4b-dpal
  max_length: 3072
  chat_template: qwen
  cache_dir: ./cache

training:
  strategy: dflash
  num_epochs: 6
  batch_size: 8
  accumulation_steps: 1
  learning_rate: 6.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: flex_attention
  num_anchors: 512
  objective_chunk_blocks: 32
  loss_type: dpard
  dpace_alpha: 0.3
  dpard_alpha: 0.3
  dflash_loss_reduction: sequence_anchor_mean
  dflash2_selector_loss_alpha: 0.0
  save_interval: 5000
  log_interval: 1000000000
  dist_timeout: 30
  seed: 42
  lk_loss_type: null
  loss_decay_gamma: null

run_id: qwen3-4b-dpal
output_dir: ./outputs/qwen3-4b-dpal

deployment:
  mode: local_colocated
  trainer:
    nnodes: 1
    nproc_per_node: 1
